<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup - Art Gallery</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">Art Gallery</a>

        <div>
            <a class="btn btn-outline-light me-2" href="gallery.html">Gallery</a>
            <a class="btn btn-outline-light me-2" href="login.html">Login</a>
            <a class="btn btn-outline-light" href="signup.html">Sign Up</a>
        </div>
    </div>
</nav>


<div class="container mt-5">

    <div class="card mx-auto p-4" style="max-width:400px;">

        <h2 class="text-center mb-4">
            Create Account
        </h2>

        <form>

            <div class="mb-3">
                <label>Name</label>
                <input type="text" class="form-control" placeholder="Enter your name">
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" class="form-control" placeholder="Enter email">
            </div>

            <div class="mb-3">
                <label>Password</label>
                <input type="password" class="form-control" placeholder="Create password">
            </div>

            <div class="mb-3">
                <label>Confirm Password</label>
                <input type="password" class="form-control" placeholder="Confirm password">
            </div>

            <button class="btn btn-success w-100">
                Register
            </button>

        </form>

    </div>

</div>

</body>
</html>
